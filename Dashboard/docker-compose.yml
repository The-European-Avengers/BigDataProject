version: "3.8"

services:
  redis:
    image: redis:7.2-alpine
    container_name: hdfs-dashboard-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - dashboard-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hdfs-dashboard-backend
    ports:
      - "3000:3000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - HIVE_HOST=${HIVE_HOST:-localhost}
      - HIVE_PORT=${HIVE_PORT:-10000}
      - HIVE_DATABASE=${HIVE_DATABASE:-default}
      - API_PORT=3000
      - CACHE_TTL=3600
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - dashboard-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hdfs-dashboard-frontend
    ports:
      - "3001:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:3000
    depends_on:
      - backend
    networks:
      - dashboard-network

volumes:
  redis-data:

networks:
  dashboard-network:
    driver: bridge
