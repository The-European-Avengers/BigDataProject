apiVersion: apps/v1
kind: Deployment
metadata:
  name: batch-enrichment-price
  namespace: bd-gr-05 
  labels:
    app: batch-enrichment-price
spec:
  replicas: 1
  selector:
    matchLabels:
      app: batch-enrichment-price
  template:
    metadata:
      labels:
        app: batch-enrichment-price
    spec:
      imagePullSecrets:
        - name: gitlab-registry

      containers:
        - name: batch-enrichment-price
          image: registry.gitlab.sdu.dk/the-european-avengers/bigdataproject/batch-enrichment-price:latest
          imagePullPolicy: Always

          # Override command to keep container alive for debugging
          command: ["/bin/bash", "-c"]
          args:
            - |
              echo "============================================================"
              echo "  BATCH ENRICHMENT - ELECTRICITY PRICE DATA"
              echo "============================================================"
              echo ""
              echo "Container started successfully!"
              echo "Environment:"
              echo "  HDFS_NAMENODE: ${HDFS_NAMENODE}"
              echo "  USER: $(whoami)"
              echo "  WORKING DIR: $(pwd)"
              echo ""
              echo "============================================================"
              echo "  Running batch enrichment job for price data..."
              echo "============================================================"
              echo ""
              python3 /home/sparkuser/batch_enrichment_price.py
              echo ""
              echo "============================================================"
              echo "  Job completed! Exit code: $?"
              echo "============================================================"
              echo ""
              echo "Keeping container alive for 1 hour for debugging..."
              sleep 3600

          env:
            # Use HA nameservice address
            - name: HDFS_NAMENODE
              value: "hdfs://namenode-g5-ha"
            - name: HADOOP_CONF_fs_defaultFS
              value: "hdfs://namenode-g5-ha"
            # Tell Spark where to find the mounted XML files
            - name: HADOOP_CONF_DIR
              value: "/etc/hadoop/conf"

          volumeMounts:
            # Mount the HA configuration from your ConfigMap
            - name: hadoop-xml-volume
              mountPath: "/etc/hadoop/conf/core-site.xml"
              subPath: "core-site.xml"
            - name: hadoop-xml-volume
              mountPath: "/etc/hadoop/conf/hdfs-site.xml"
              subPath: "hdfs-site.xml"

          ports:
            - containerPort: 4040
              name: spark-ui

          resources:
            requests:
              cpu: "2"
              memory: "4Gi"
            limits:
              cpu: "4"
              memory: "8Gi"
      
      volumes:
        # Reference your existing hadoop-xml-config
        - name: hadoop-xml-volume
          configMap:
            name: hadoop-xml-config

      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: batch-enrichment-price
  namespace: bd-gr-05 
  labels:
    app: batch-enrichment-price
spec:
  selector:
    app: batch-enrichment-price
  ports:
    - name: spark-ui
      port: 4040
      targetPort: 4040
  type: ClusterIP