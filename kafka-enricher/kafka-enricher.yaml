apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-enricher
  namespace: bd-bd-gr-05
  labels:
    app: kafka-enricher
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-enricher
  template:
    metadata:
      labels:
        app: kafka-enricher
    spec:
      imagePullSecrets:
        - name: gitlab-registry

      containers:
        - name: kafka-enricher
          image: registry.gitlab.sdu.dk/the-european-avengers/bigdataproject/kafka-enricher:latest
          imagePullPolicy: Always
          env:
            # 🔧 FIX: Use kafka-g5-controller-headless (same as producers)
            # Alternative: You can also use "kafka-g5:9092" since both exist
            - name: BOOTSTRAP_SERVERS
              value: "kafka-g5-controller-headless:9092"
            - name: SCHEMA_REGISTRY_URL
              value: "http://schema-registry:8081"
            # 🔧 Changed checkpoint path to v3 to start fresh
            - name: CHECKPOINT_ROOT
              value: "/tmp/spark/checkpoints/kafka_enricher_v7"
            # 🔧 HDFS Configuration
            - name: HDFS_NAMENODE
              value: "hdfs://namenode-g5:9000"
            - name: HADOOP_CONF_fs_defaultFS
              value: "hdfs://namenode-g5:9000"
          ports:
            - containerPort: 4040
          readinessProbe:
            exec:
              command: ["bash", "-c", "pgrep -f 'spark' > /dev/null"]
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["bash", "-c", "pgrep -f 'spark' > /dev/null"]
            initialDelaySeconds: 90
            periodSeconds: 20
          resources:
            limits:
              cpu: "2"
              memory: "4Gi"
            requests:
              cpu: "500m"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-enricher
  namespace: bd-bd-gr-05
  labels:
    app: kafka-enricher
spec:
  selector:
    app: kafka-enricher
  ports:
    - name: spark-ui
      port: 4040
      targetPort: 4040
  type: ClusterIP