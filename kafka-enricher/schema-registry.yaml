apiVersion: v1
kind: ConfigMap
metadata:
  name: schema-registry-config
  namespace: bd-bd-gr-05
data:
  # 🔧 CRITICAL FIX: Use port 9092 (CLIENT listener), NOT 9094 (INTERNAL listener)
  SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: "kafka-g5-controller-0.kafka-g5-controller-headless.bd-bd-gr-05.svc.cluster.local:9092,kafka-g5-controller-1.kafka-g5-controller-headless.bd-bd-gr-05.svc.cluster.local:9092,kafka-g5-controller-2.kafka-g5-controller-headless.bd-bd-gr-05.svc.cluster.local:9092"
  SCHEMA_REGISTRY_HOST_NAME: "schema-registry"
  SCHEMA_REGISTRY_LISTENERS: "http://0.0.0.0:8081"
  # Topic where schemas are stored in Kafka
  SCHEMA_REGISTRY_KAFKASTORE_TOPIC: "_schemas"
  SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: "3"
  # Increase timeouts for initial connection
  SCHEMA_REGISTRY_KAFKASTORE_TIMEOUT_MS: "60000"
  SCHEMA_REGISTRY_KAFKASTORE_INIT_TIMEOUT_MS: "90000"
  # Additional settings
  SCHEMA_REGISTRY_SCHEMA_REGISTRY_GROUP_ID: "schema-registry"
  SCHEMA_REGISTRY_MASTER_ELIGIBILITY: "true"
  # Debug mode
  SCHEMA_REGISTRY_DEBUG: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: schema-registry
  namespace: bd-bd-gr-05
  labels:
    app: schema-registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: schema-registry
  template:
    metadata:
      labels:
        app: schema-registry
    spec:
      containers:
      - name: schema-registry
        image: confluentinc/cp-schema-registry:7.4.0
        ports:
        - containerPort: 8081
          name: http
        envFrom:
        - configMapRef:
            name: schema-registry-config
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 8081
          initialDelaySeconds: 120
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /subjects
            port: 8081
          initialDelaySeconds: 90
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: schema-registry
  namespace: bd-bd-gr-05
  labels:
    app: schema-registry
spec:
  selector:
    app: schema-registry
  ports:
  - port: 8081
    targetPort: 8081
    protocol: TCP
    name: http
  type: ClusterIP