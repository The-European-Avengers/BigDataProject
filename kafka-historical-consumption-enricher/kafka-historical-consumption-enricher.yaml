apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-historical-consumption-enricher
  namespace: bd-gr-05 # 🔧 FIXED: Use the standardized namespace
  labels:
    app: kafka-historical-consumption-enricher
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-historical-consumption-enricher
  template:
    metadata:
      labels:
        app: kafka-historical-consumption-enricher
    spec:
      serviceAccountName: spark
      imagePullSecrets:
        - name: gitlab-registry
      containers:
      - name: spark-consumption-enricher
        image: registry.gitlab.sdu.dk/the-european-avengers/bigdataproject/kafka-historical-consumption-enricher:latest
        imagePullPolicy: Always
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        env:
        - name: BOOTSTRAP_SERVERS
          value: "kafka-g5:9092" # 🔧 UPDATED: Match standardized broker name
        - name: SCHEMA_REGISTRY_URL
          # 🔧 FIXED: Use FQDN for reliable resolution
          value: "http://schema-registry:8081"
        - name: HDFS_NAMENODE
          value: "hdfs://namenode-g5-ha" # 🔧 FIXED: Use HA Nameservice
        - name: HADOOP_CONF_fs_defaultFS
          value: "hdfs://namenode-g5-ha"
        - name: CHECKPOINT_ROOT
          value: "/tmp/spark/checkpoints/historical_consumption_enricher_v14" # Incremented version
        - name: TRIGGER_INTERVAL
          value: "1 day"
        - name: MUNICIPALITY_CSV_HDFS
          value: "hdfs://namenode-g5-ha/utils/municipality_codes_to_coordinates.csv"
        - name: HADOOP_CONF_DIR
          value: "/etc/hadoop/conf" # 🔧 FIXED: Location of mounted XMLs
        volumeMounts:
        # 🔧 ADDED: Mount core-site and hdfs-site XMLs from your ConfigMap
        - name: hadoop-xml-volume
          mountPath: "/etc/hadoop/conf/core-site.xml"
          subPath: "core-site.xml"
        - name: hadoop-xml-volume
          mountPath: "/etc/hadoop/conf/hdfs-site.xml"
          subPath: "hdfs-site.xml"
      volumes:
      # 🔧 ADDED: Reference the existing hadoop-xml-config
      - name: hadoop-xml-volume
        configMap:
          name: hadoop-xml-config
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-historical-consumption-enricher
  namespace: bd-gr-05 # 🔧 FIXED
  labels:
    app: kafka-historical-consumption-enricher
spec:
  selector:
    app: kafka-historical-consumption-enricher
  ports:
  - name: spark-ui
    protocol: TCP
    port: 4040
    targetPort: 4040
  type: ClusterIP