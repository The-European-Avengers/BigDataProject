apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-historical-weather-enricher
  namespace: bd-gr-05  
  labels:
    app: kafka-historical-weather-enricher
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-historical-weather-enricher
  template:
    metadata:
      labels:
        app: kafka-historical-weather-enricher
    spec:
      imagePullSecrets:
        - name: gitlab-registry

      containers:
        - name: kafka-historical-weather-enricher
          image: registry.gitlab.sdu.dk/the-european-avengers/bigdataproject/kafka-historical-weather-enricher:latest
          imagePullPolicy: Always
          env:
            - name: BOOTSTRAP_SERVERS
              value: "kafka-g5:9092" 

            - name: SCHEMA_REGISTRY_URL
              value: "http://schema-registry:8081"

            - name: CHECKPOINT_ROOT
              value: "/tmp/spark/checkpoints/historical_enricher_v17"
            
            - name: HDFS_NAMENODE
              value: "hdfs://namenode-g5-0.namenode-g5.bd-gr-05.svc.cluster.local:9000"            
            
            - name: HADOOP_CONF_fs_defaultFS
              value: "hdfs://namenode-g5-ha"
            
            - name: MUNICIPALITY_CSV_HDFS
              value: "hdfs://namenode-g5-ha/utils/municipality_codes_to_coordinates.csv"
            
            - name: HADOOP_CONF_DIR
              value: "/etc/hadoop/conf"
            
            - name: TRIGGER_INTERVAL
              value: "60 seconds"
            
          volumeMounts:
            - name: hadoop-xml-volume
              mountPath: "/etc/hadoop/conf/core-site.xml"
              subPath: "core-site.xml"
            - name: hadoop-xml-volume
              mountPath: "/etc/hadoop/conf/hdfs-site.xml"
              subPath: "hdfs-site.xml"
              
          ports:
            - containerPort: 4040
              name: spark-ui
          
          resources:
            limits:
              cpu: "2"
              memory: "4Gi"
            requests:
              cpu: "500m"
              memory: "1Gi"
      volumes:
        - name: hadoop-xml-volume
          configMap:
            name: hadoop-xml-config
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-historical-weather-enricher
  namespace: bd-gr-05 
spec:
  selector:
    app: kafka-historical-weather-enricher
  ports:
    - name: spark-ui
      port: 4040
      targetPort: 4040
  type: ClusterIP