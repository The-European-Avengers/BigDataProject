apiVersion: v1
kind: ConfigMap
metadata:
  name: hadoop-xml-config
  namespace: bd-gr-05
data:
  core-site.xml: |
    <?xml version="1.0" encoding="UTF-8"?>
    <configuration>
      <property><name>fs.defaultFS</name><value>hdfs://namenode-g5-ha</value></property>
      <property><name>ha.zookeeper.quorum</name><value>zookeeper-g5-0.zookeeper-g5.bd-gr-05.svc.cluster.local:2181,zookeeper-g5-1.zookeeper-g5.bd-gr-05.svc.cluster.local:2181,zookeeper-g5-2.zookeeper-g5.bd-gr-05.svc.cluster.local:2181</value></property>
    </configuration>
  hdfs-site.xml: |
    <?xml version="1.0" encoding="UTF-8"?>
    <configuration>
      <property><name>dfs.nameservices</name><value>namenode-g5-ha</value></property>
      <property><name>dfs.ha.namenodes.namenode-g5-ha</name><value>nn1,nn2</value></property>
      <property><name>dfs.namenode.name.dir</name><value>file:///hadoop/dfs/name</value></property>
      <property><name>dfs.namenode.rpc-address.namenode-g5-ha.nn1</name><value>namenode-g5-0.namenode-g5.bd-gr-05.svc.cluster.local:9000</value></property>
      <property><name>dfs.namenode.rpc-address.namenode-g5-ha.nn2</name><value>namenode-g5-1.namenode-g5.bd-gr-05.svc.cluster.local:9000</value></property>
      <property><name>dfs.namenode.http-address.namenode-g5-ha.nn1</name><value>namenode-g5-0.namenode-g5.bd-gr-05.svc.cluster.local:9870</value></property>
      <property><name>dfs.namenode.http-address.namenode-g5-ha.nn2</name><value>namenode-g5-1.namenode-g5.bd-gr-05.svc.cluster.local:9870</value></property>
      <property><name>dfs.namenode.shared.edits.dir</name><value>qjournal://journalnode-g5-0.journalnode-g5.bd-gr-05.svc.cluster.local:8485;journalnode-g5-1.journalnode-g5.bd-gr-05.svc.cluster.local:8485;journalnode-g5-2.journalnode-g5.bd-gr-05.svc.cluster.local:8485/namenode-g5-ha</value></property>
      <property><name>dfs.client.failover.proxy.provider.namenode-g5-ha</name><value>org.apache.hadoop.hdfs.server.namenode.ha.ConfiguredFailoverProxyProvider</value></property>
      <property><name>dfs.ha.automatic-failover.enabled</name><value>true</value></property>
      <property><name>dfs.ha.fencing.methods</name><value>shell(/bin/true)</value></property>
      <property><name>dfs.permissions.enabled</name><value>false</value></property>
      <property><name>dfs.namenode.datanode.registration.ip-hostname-check</name><value>false</value></property>
    </configuration>