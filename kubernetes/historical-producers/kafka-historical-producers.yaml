apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-historical-producer-sun
  namespace: bd-bd-gr-05
data:
  PARAMETER_ID: "mean_radiation"
  VALUE_FIELD_NAME: "mean_radiation"
  TOPIC: "historical-weather-sun"
  BOOTSTRAP_SERVERS: "kafka-g5-controller-headless:9092"
  SCHEMA_REGISTRY_URL: "http://schema-registry:8081"
  POLL_INTERVAL: "86400"  # 24 hours - runs once per day
