apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-historical-producer-wind
  namespace: bd-bd-gr-05
data:
  PARAMETER_ID: "mean_wind_speed"
  VALUE_FIELD_NAME: "mean_wind_speed"
  TOPIC: "historical-weather-wind"
  BOOTSTRAP_SERVERS: "kafka-g5-controller-headless:9092"
  SCHEMA_REGISTRY_URL: "http://schema-registry:8081"
  POLL_INTERVAL: "86400"  # 24 hours - runs once per day
  API_KEY: "d36196e2-2a58-4497-bf28-f71d18c427a1"
  SHAPEFILE_PATH: "/app/dk.shp"
  RUN_ONCE: "false"
---
apiVersion: v1
