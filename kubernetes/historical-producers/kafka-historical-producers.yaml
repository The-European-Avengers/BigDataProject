---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-historical-producer-wind-g5
  namespace: bd-bd-gr-05
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-historical-producer-wind-g5
  template:
    metadata:
      labels:
        app: kafka-historical-producer-wind-g5
    spec:
      containers:
      - name: producer
        image: registry.gitlab.sdu.dk/the-european-avengers/bigdataproject/historical-data-producers:latest
        imagePullPolicy: Always
        envFrom:
        - configMapRef:
            name: kafka-historical-producer-wind
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
      imagePullSecrets:
        - name: gitlab-registry
---
