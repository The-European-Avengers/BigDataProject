---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-producer-sun
  namespace: bd-bd-gr-05
data:
  API_URL: "https://dmigw.govcloud.dk/v1/forecastedr/collections/harmonie_dini_sf/cube"
  PARAMETER_NAME: "direct-solar-exposure"
  TOPIC: "weather-sun"
  BOOTSTRAP_SERVERS: "kafka-g5-controller-headless:9092"
  SCHEMA_REGISTRY_URL: "http://schema-registry:8081"
  POLL_INTERVAL: "10800"
  API_KEY: "9c1728d6-69ec-4be2-8e6c-72dee4dc44df"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-producer-1-g5
  namespace: bd-bd-gr-05
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-producer-1-g5
  template:
    metadata:
      labels:
        app: kafka-producer-1-g5
    spec:
      containers:
      - name: producer
        image: registry.gitlab.sdu.dk/the-european-avengers/bigdataproject/live-data-producers:latest
        imagePullPolicy: Always
        envFrom:
        - configMapRef:
            name: kafka-producer-wind
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "6Gi"
            cpu: "2000m"
      imagePullSecrets:
        - name: gitlab-registry
---
