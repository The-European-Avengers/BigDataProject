apiVersion: v1
kind: ConfigMap
metadata:
  name: redpanda-console-config
  namespace: bd-bd-gr-05
data:
  config.yaml: |
    kafka:
      brokers:
        - kafka-g5-controller-0.kafka-g5-controller-headless.bd-bd-gr-05.svc.cluster.local:9092
        - kafka-g5-controller-1.kafka-g5-controller-headless.bd-bd-gr-05.svc.cluster.local:9092
        - kafka-g5-controller-2.kafka-g5-controller-headless.bd-bd-gr-05.svc.cluster.local:9092
      schemaRegistry:
        enabled: true
        urls:
          - http://schema-registry:8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redpanda-console
  namespace: bd-bd-gr-05
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redpanda-console
  template:
    metadata:
      labels:
        app: redpanda-console
    spec:
      containers:
      - name: console
        image: docker.redpanda.com/redpandadata/console:v2.4.5
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: config
          mountPath: /etc/console/configs
          readOnly: true
        env:
        - name: CONFIG_FILEPATH
          value: /etc/console/configs/config.yaml
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      volumes:
      - name: config
        configMap:
          name: redpanda-console-config
---
apiVersion: v1
kind: Service
metadata:
  name: redpanda-console
  namespace: bd-bd-gr-05
spec:
  type: ClusterIP
  selector:
    app: redpanda-console
  ports:
  - port: 8080
    targetPort: 8080