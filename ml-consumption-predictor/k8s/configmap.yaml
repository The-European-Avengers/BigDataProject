apiVersion: v1
kind: ConfigMap
metadata:
  name: energy-ml-config
  namespace: default
data:
  # Data paths
  DATA_BASE_PATH: "/data"
  
  # Model configuration
  N_TRAINING_YEARS: "5"
  FORECAST_DAYS: "5"
  
  # Spark configuration
  SPARK_MASTER: "local[*]"
  SPARK_EXECUTOR_MEMORY: "4g"
  SPARK_DRIVER_MEMORY: "4g"
  SPARK_EXECUTOR_CORES: "2"