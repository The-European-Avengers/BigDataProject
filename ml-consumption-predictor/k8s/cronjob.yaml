---
# Spark Application for scheduled execution
apiVersion: sparkoperator.k8s.io/v1beta2
kind: ScheduledSparkApplication
metadata:
  name: energy-ml-predictor
  namespace: bd-bd-gr-05
spec:
  # Run daily at 2 AM
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulRunHistoryLimit: 3
  failedRunHistoryLimit: 1
  
  template:
    type: Python
    pythonVersion: "3"
    mode: cluster
    image: "registry.gitlab.sdu.dk/the-european-avengers/bigdataproject/energy-ml-predictor:latest"
    imagePullPolicy: Always
    mainApplicationFile: "local:///opt/spark/work-dir/src/main.py"
    
    arguments:
      - "--training-years"
      - "4"
      - "--mode"
      - "kubernetes"
    
    sparkVersion: "3.5.0"
    restartPolicy:
      type: OnFailure
      onFailureRetries: 2
      onFailureRetryInterval: 60
    
    driver:
      cores: 4
      memory: "8g"
      labels:
        app: energy-ml-predictor
        component: driver
      serviceAccount: spark
      
      volumeMounts:
        - name: data-volume
          mountPath: /data
      
      envFrom:
        - configMapRef:
            name: energy-ml-config
    
    executor:
      cores: 4
      instances: 2
      memory: "8g"
      labels:
        app: energy-ml-predictor
        component: executor
      
      volumeMounts:
        - name: data-volume
          mountPath: /data
      
      envFrom:
        - configMapRef:
            name: energy-ml-config
    
    volumes:
      - name: data-volume
        persistentVolumeClaim:
          claimName: energy-data-pvc
    
    deps:
      packages:
        - "org.apache.spark:spark-avro_2.12:3.5.0"