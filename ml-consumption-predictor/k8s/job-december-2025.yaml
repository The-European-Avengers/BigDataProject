---
# Kubernetes Job for December 2025 predictions
# Uses standard Job instead of SparkApplication
apiVersion: batch/v1
kind: Job
metadata:
  name: energy-ml-predictor-dec2025
  namespace: bd-bd-gr-05
  labels:
    app: energy-ml-predictor
    prediction-month: "2025-12"
spec:
  # Retry on failure
  backoffLimit: 2
  
  # Clean up after 24 hours
  ttlSecondsAfterFinished: 86400
  
  template:
    metadata:
      labels:
        app: energy-ml-predictor
        component: spark-job
        prediction-month: "2025-12"
    spec:
      restartPolicy: OnFailure
      # Removed serviceAccountName - uncomment if you have it
      # serviceAccountName: spark
      
      # Removed imagePullSecrets - uncomment if needed
      # imagePullSecrets:
      #   - name: gitlab-registry
      
      containers:
        - name: spark-driver
          image: registry.gitlab.sdu.dk/the-european-avengers/bigdataproject/energy-ml-predictor:latest
          imagePullPolicy: Always
          
          # Command to run spark-submit
          command: ["/bin/bash", "-c"]
          args:
            - |
              spark-submit \
                --master local[2] \
                --driver-memory 4g \
                --executor-memory 4g \
                --conf spark.driver.maxResultSize=1g \
                --conf spark.sql.shuffle.partitions=16 \
                --conf spark.default.parallelism=16 \
                --conf spark.executor.cores=4 \
                --conf spark.sql.adaptive.enabled=true \
                --conf spark.sql.adaptive.coalescePartitions.enabled=true \
                --packages org.apache.spark:spark-avro_2.12:3.5.0 \
                /opt/spark/work-dir/src/main.py \
                --days "2025-12-01,2025-12-02,2025-12-03,2025-12-04,2025-12-05,2025-12-06,2025-12-07,2025-12-08,2025-12-09,2025-12-10,2025-12-11,2025-12-12,2025-12-13,2025-12-14,2025-12-15,2025-12-16,2025-12-17,2025-12-18,2025-12-19,2025-12-20,2025-12-21,2025-12-22,2025-12-23,2025-12-24,2025-12-25,2025-12-26,2025-12-27,2025-12-28,2025-12-29,2025-12-30,2025-12-31" \
                --training-years 3 \
                --mode kubernetes
          
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: SPARK_DRIVER_MEMORY
              value: "4g"
            - name: SPARK_EXECUTOR_MEMORY
              value: "4g"
          
          envFrom:
            - configMapRef:
                name: energy-ml-config
          
          volumeMounts:
            - name: data-volume
              mountPath: /data
          
          resources:
            requests:
              cpu: "1000m"
              memory: "6Gi"
            limits:
              cpu: "2000m"
              memory: "7Gi"
      
      volumes:
        - name: data-volume
          persistentVolumeClaim:
            claimName: energy-data-pvc
---
# Service for Spark UI (optional, for monitoring)
apiVersion: v1
kind: Service
metadata:
  name: energy-ml-predictor-ui
  namespace: bd-bd-gr-05
  labels:
    app: energy-ml-predictor
spec:
  selector:
    app: energy-ml-predictor
    component: spark-job
  ports:
    - name: spark-ui
      port: 4040
      targetPort: 4040
  type: ClusterIP