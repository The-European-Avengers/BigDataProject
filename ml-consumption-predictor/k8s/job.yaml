---
# Spark Application for manual/one-time execution
apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: energy-ml-predictor-manual
  namespace: default
spec:
  type: Python
  pythonVersion: "3"
  mode: cluster
  image: "your-registry/energy-ml-predictor:latest"
  imagePullPolicy: Always
  mainApplicationFile: "local:///opt/spark/work-dir/src/main.py"
  
  # Customize arguments for specific execution
  arguments:
    - "--training-years"
    - "4"
    - "--mode"
    - "kubernetes"
    # Uncomment to specify specific days:
    # - "--days"
    # - "2024-12-01,2024-12-02,2024-12-03"
  
  sparkVersion: "3.5.0"
  restartPolicy:
    type: OnFailure
    onFailureRetries: 2
    onFailureRetryInterval: 60
  
  driver:
    cores: 2
    memory: "4g"
    labels:
      app: energy-ml-predictor
      component: driver
      run: manual
    serviceAccount: spark
    
    volumeMounts:
      - name: data-volume
        mountPath: /data
    
    envFrom:
      - configMapRef:
          name: energy-ml-config
  
  executor:
    cores: 2
    instances: 2
    memory: "4g"
    labels:
      app: energy-ml-predictor
      component: executor
      run: manual
    
    volumeMounts:
      - name: data-volume
        mountPath: /data
    
    envFrom:
      - configMapRef:
          name: energy-ml-config
  
  volumes:
    - name: data-volume
      persistentVolumeClaim:
        claimName: energy-data-pvc
  
  deps:
    packages:
      - "org.apache.spark:spark-avro_2.12:3.5.0"