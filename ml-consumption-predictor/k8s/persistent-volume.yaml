---
# PersistentVolumeClaim for data storage
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: energy-data-pvc
  namespace: bd-bd-gr-05
spec:
  accessModes:
    - ReadWriteMany  # Multiple pods can read/write
  resources:
    requests:
      storage: 50Gi  # Adjust based on your data size
  storageClassName: microk8s-hostpath  # Change to your storage class