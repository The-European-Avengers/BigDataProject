---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spark
  namespace: bd-bd-gr-05
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spark-role
  namespace: bd-bd-gr-05
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spark-rolebinding
  namespace: bd-bd-gr-05
subjects:
  - kind: ServiceAccount
    name: spark
    namespace: bd-bd-gr-05
roleRef:
  kind: Role
  name: spark-role
  apiGroup: rbac.authorization.k8s.io